<section class="bg-home">
  <app-header />

  <!-- Non auth Routing -->
  @switch (currentRoute) { @case ('') {
  <app-landing-page />
  } @case ('login') {
  <app-login />
  } @case ('register') {
  <app-register />
  } @case ('forgot-password') {
  <app-forgot-password />
  } @case ('verify-email') {
  <app-verify-email />
  } }

  <app-footer />

  @if (errorService.displayError) {
  <app-error-toast />
  }
</section>
